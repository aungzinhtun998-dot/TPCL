<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0B7285"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="TPCL"
    >

    <title>TPCL</title>


    <!-- ==================================================
         PWA
    ================================================== -->

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >


    <!-- ==================================================
         LEAFLET CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3b1s8mY6J5W3Xn1Q1Z1FQ0Q2Z0Q0Q="
        crossorigin=""
    >


    <!-- ==================================================
         TPCL CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- ==================================================
         SEARCH BAR
    ================================================== -->

    <div
        class="search-box"
        id="searchBox"
    >

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search Customer..."
            autocomplete="off"
            oninput="searchCustomer()"
        >

    </div>


    <!-- ==================================================
         MAP
    ================================================== -->

    <div
        id="map"
        aria-label="TPCL Customer Map"
    ></div>


    <!-- ==================================================
         GPS BUTTON
    ================================================== -->

    <button
        id="gpsBtn"
        type="button"
        onclick="goCurrentLocation()"
        aria-label="Current Location"
        title="Current Location"
    >
        📍
    </button>


    <!-- ==================================================
         CUSTOMER LIST BUTTON
    ================================================== -->

    <button
        id="listBtn"
        type="button"
        onclick="toggleList()"
        aria-label="Customer List"
        title="Customer List"
    >
        📋
    </button>


    <!-- ==================================================
         CUSTOMER / VEHICLE / TIRE / INSPECTION PANEL
    ================================================== -->

    <div
        id="customerList"
        aria-label="TPCL Data Panel"
    >

        <!-- PANEL HEADER -->

        <div class="sheet-header">

            <h3>
                Customer List
            </h3>

            <button
                type="button"
                onclick="closePanel()"
                aria-label="Close"
                title="Close"
            >
                ✕
            </button>

        </div>


        <!-- PANEL CONTENT -->

        <div id="listContent">

            <div
                style="
                    padding:20px;
                    text-align:center;
                    color:#777;
                "
            >

                Loading Customers...

            </div>

        </div>

    </div>


    <!-- ==================================================
         LEAFLET JS
    ================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>


    <!-- ==================================================
         TPCL APP JS
    ================================================== -->

    <script src="./app.js"></script>


    <!-- ==================================================
         PWA SERVICE WORKER
         GitHub Pages compatible
    ================================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(function (registration) {

                            console.log(
                                "TPCL Service Worker registered:",
                                registration.scope
                            );

                        })
                        .catch(function (error) {

                            console.error(
                                "TPCL Service Worker registration failed:",
                                error
                            );

                        });

                }
            );

        }

    </script>


</body>

</html>
