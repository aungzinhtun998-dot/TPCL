<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TPCL</title>

    <!-- PWA -->
    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <meta
        name="theme-color"
        content="#0B7285"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>


    <!-- ==================================================
         TOP SEARCH BAR
    ================================================== -->

    <div class="top-bar">

        <!-- Search -->
<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search Customer..."
        onkeyup="searchCustomer()">

</div>


<!-- Filter Button -->
<button
    id="filterBtn"
    onclick="toggleFilter()">
    🔎 Filter
</button>


<!-- Map -->
<div id="map"></div>


<!-- GPS Button -->
<button
    id="gpsBtn"
    onclick="goCurrentLocation()">
    📍
</button>


<!-- Customer List Button -->
<button
    id="listBtn"
    onclick="toggleList()">
    📋
</button>


<!-- Customer List -->
<div id="customerList">

    <div class="sheet-header">

        <h3>Customer List</h3>

        <button
            id="closeListBtn"
            onclick="closePanel()">
            ✕
        </button>

    </div>


    <!-- Filter Area -->
    <div id="filterArea">

        <select id="regionFilter">
            <option value="">
                All Regions
            </option>
        </select>


        <select id="townshipFilter">
            <option value="">
                All Townships
            </option>
        </select>


        <select id="brandFilter">
            <option value="">
                All Brands
            </option>
        </select>


        <button onclick="applyFilters()">
            Apply
        </button>


        <button onclick="clearFilters()">
            Clear
        </button>

    </div>


    <!-- Customer List Content -->
    <div id="listContent">

        Loading Customers...

    </div>

</div>



    <!-- ==================================================
         FILTER PANEL
    ================================================== -->

    <div
        id="filterPanel"
        class="filter-panel"
    >

        <div class="filter-header">

            <b>⚙️ Filter</b>

            <button
                onclick="toggleFilterPanel()"
            >
                ✕
            </button>

        </div>


        <!-- Region -->

        <label>
            Region
        </label>

        <select id="regionFilter">

            <option value="">
                All Regions
            </option>

        </select>


        <!-- Township -->

        <label>
            Township
        </label>

        <select id="townshipFilter">

            <option value="">
                All Townships
            </option>

        </select>


        <!-- Brand -->

        <label>
            Brand
        </label>

        <select id="brandFilter">

            <option value="">
                All Brands
            </option>

        </select>


        <!-- Vehicle Type -->

        <label>
            Vehicle Type
        </label>

        <select id="vehicleTypeFilter">

            <option value="">
                All Vehicle Types
            </option>

        </select>


        <!-- Buttons -->

        <div class="filter-actions">

            <button
                class="clear-filter-btn"
                onclick="clearFilters()"
            >
                Clear
            </button>

            <button
                class="apply-filter-btn"
                onclick="applyFilters()"
            >
                Apply
            </button>

        </div>

    </div>



    <!-- ==================================================
         MAP
    ================================================== -->

    <div id="map"></div>



    <!-- ==================================================
         GPS BUTTON
    ================================================== -->

    <button
        id="gpsBtn"
        onclick="goCurrentLocation()"
    >
        📍
    </button>



    <!-- ==================================================
         CUSTOMER LIST BUTTON
    ================================================== -->

    <button
        id="listBtn"
        onclick="toggleList()"
    >
        📋
    </button>



    <!-- ==================================================
         CUSTOMER LIST
    ================================================== -->

    <div id="customerList">

        <div class="sheet-header">

            <h3>
                Customer List
            </h3>

        </div>


        <div id="listContent">

            Loading Customers...

        </div>

    </div>



    <!-- ==================================================
         LEAFLET JS
    ================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- ==================================================
         APP JS
    ================================================== -->

    <script
        src="./app.js"
    ></script>


</body>

</html>
