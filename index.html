<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TPCL</title>

    <!-- PWA -->
    <link
        rel="manifest"
        href="./manifest.json"
    >

    <meta
        name="theme-color"
        content="#0B7285"
    >

    <link
        rel="icon"
        type="image/png"
        href="./icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- TPCL CSS -->
    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>


<body>

    <!-- ============================= -->
    <!-- SEARCH -->
    <!-- ============================= -->

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="🔍 Search Customer..."
            autocomplete="off"
            oninput="searchCustomer()"
        >

    </div>


    <!-- ============================= -->
    <!-- MAP -->
    <!-- ============================= -->

    <div id="map"></div>


    <!-- ============================= -->
    <!-- GPS BUTTON -->
    <!-- ============================= -->

    <button
        id="gpsBtn"
        type="button"
        onclick="goCurrentLocation()"
        aria-label="Current Location"
    >
        📍
    </button>


    <!-- ============================= -->
    <!-- LIST BUTTON -->
    <!-- ============================= -->

    <button
        id="listBtn"
        type="button"
        onclick="toggleList()"
        aria-label="Customer List"
    >
        📋
    </button>


    <!-- ============================= -->
    <!-- CUSTOMER PANEL -->
    <!-- ============================= -->

    <div id="customerList">

        <div class="sheet-header">

            <h3>Customer List</h3>

            <button
                type="button"
                onclick="closePanel()"
                aria-label="Close"
            >
                ✕
            </button>

        </div>


        <div id="listContent">

            Loading Customers...

        </div>

    </div>


    <!-- ============================= -->
    <!-- LEAFLET JS -->
    <!-- ============================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- ============================= -->
    <!-- TPCL APP -->
    <!-- ============================= -->

    <script src="./app.js"></script>


    <!-- ============================= -->
    <!-- MAP SIZE FIX -->
    <!-- ============================= -->

    <script>

        window.addEventListener("load", function () {

            setTimeout(function () {

                if (
                    typeof map !== "undefined" &&
                    map
                ) {

                    map.invalidateSize(true);

                }

            }, 500);

        });

    </script>


</body>

</html>
