<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TPCL</title>

    <!-- PWA Manifest -->
    <link rel="manifest"
          href="./manifest.json">

    <!-- TPCL App Icon -->
    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="./icon-192.png">

    <link rel="apple-touch-icon"
          href="./icon-192.png">

    <!-- Theme Color -->
    <meta name="theme-color"
          content="#0B7285">

    <!-- CSS -->
    <link rel="stylesheet"
          href="./style.css">

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>

<body>

    <!-- Search -->
    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search Customer..."
            onkeyup="searchCustomer()">

    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- GPS Button -->
    <button id="gpsBtn" onclick="goCurrentLocation()">
        📍
    </button>

    <!-- Customer List Button -->
    <button id="listBtn" onclick="toggleList()">
        📋
    </button>

    <!-- Bottom Sheet -->
    <div id="customerList">

        <div class="sheet-header">

            <h3>Customer List</h3>

        </div>

        <div id="listContent">

            Loading Customers...

        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- App JS -->
    <script src="app.js"></script>

</body>

</html>
