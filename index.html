<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TPCL</title>

    <!-- PWA -->
    <link
        rel="manifest"
        href="./manifest.json"
    >

    <meta
        name="theme-color"
        content="#0B7285"
    >

    <link
        rel="icon"
        type="image/png"
        href="./icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <!-- TPCL CSS -->
    <link
        rel="stylesheet"
        href="./style.css?v=11"
    >

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>


    <!-- =========================
         SEARCH
    ========================== -->

    <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search Customer..."
            autocomplete="off"
        >

    </div>


    <!-- =========================
         FILTER BUTTON
    ========================== -->

    <button
        id="filterBtn"
        type="button"
        onclick="toggleFilter()"
    >
        🔎 Filter
    </button>


    <!-- =========================
         FILTER PANEL
    ========================== -->

    <div id="filterPanel">

        <div class="filter-row">

            <select id="regionFilter">
                <option value="">All Regions</option>
            </select>

            <select id="townshipFilter">
                <option value="">All Townships</option>
            </select>

            <select id="brandFilter">
                <option value="">All Brands</option>
            </select>

        </div>


        <div class="filter-actions">

            <button
                type="button"
                onclick="applyFilters()"
            >
                Apply
            </button>

            <button
                type="button"
                class="clear-filter"
                onclick="clearFilters()"
            >
                Clear
            </button>

        </div>

    </div>


    <!-- =========================
         MAP
    ========================== -->

    <div id="map"></div>


    <!-- =========================
         GPS BUTTON
    ========================== -->

    <button
        id="gpsBtn"
        type="button"
        onclick="goCurrentLocation()"
        title="Current Location"
    >
        📍
    </button>


    <!-- =========================
         CUSTOMER LIST BUTTON
    ========================== -->

    <button
        id="listBtn"
        type="button"
        onclick="toggleList()"
        title="Customer List"
    >
        📋
    </button>


    <!-- =========================
         CUSTOMER LIST PANEL
    ========================== -->

    <div id="customerList">

        <div class="sheet-header">

            <h3 id="panelTitle">
                Customer List
            </h3>

            <button
                id="closeListBtn"
                type="button"
                onclick="closePanel()"
                title="Close"
            >
                ✕
            </button>

        </div>


        <div id="listContent">

            <div class="loading">
                Loading Customers...
            </div>

        </div>

    </div>


    <!-- =========================
         LEAFLET JS
    ========================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =========================
         TPCL APP JS
    ========================== -->

    <script
        src="./app.js?v=11"
    ></script>


</body>

</html>
