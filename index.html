<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TPCL</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icon-192.png"
    >

    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <meta
        name="theme-color"
        content="#0B7285"
    >

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- TPCL CSS -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- ==================================================
         SEARCH BAR
    ================================================== -->

    <div class="top-bar">

        <div class="search-box">

            <span class="search-icon">🔍</span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search Customer..."
                autocomplete="off"
            >

        </div>

        <button
            id="filterBtn"
            class="filter-btn"
            type="button"
            onclick="toggleFilter()"
        >
            🔎 Filter
        </button>

    </div>


    <!-- ==================================================
         FILTER PANEL
    ================================================== -->

    <div
        id="filterPanel"
        class="filter-panel"
    >

        <div class="filter-header">

            <strong>Filter Customers</strong>

            <button
                type="button"
                class="filter-close"
                onclick="closeFilter()"
            >
                ✕
            </button>

        </div>


        <div class="filter-grid">

            <!-- REGION -->

            <div class="filter-field">

                <label for="regionFilter">
                    Region
                </label>

                <select
                    id="regionFilter"
                    onchange="regionChanged()"
                >

                    <option value="">
                        All Regions
                    </option>

                </select>

            </div>


            <!-- TOWNSHIP -->

            <div class="filter-field">

                <label for="townshipFilter">
                    Township
                </label>

                <select
                    id="townshipFilter"
                    onchange="applyFilters()"
                >

                    <option value="">
                        All Townships
                    </option>

                </select>

            </div>


            <!-- TIRE SIZE -->

            <div class="filter-field">

                <label for="sizeFilter">
                    Tire Size
                </label>

                <select
                    id="sizeFilter"
                    onchange="applyFilters()"
                >

                    <option value="">
                        All Sizes
                    </option>

                </select>

            </div>

        </div>


        <div class="filter-actions">

            <button
                type="button"
                class="reset-btn"
                onclick="resetFilters()"
            >
                ↺ Reset
            </button>

            <button
                type="button"
                class="apply-btn"
                onclick="applyFilters(); closeFilter();"
            >
                ✓ Apply
            </button>

        </div>

    </div>


    <!-- ==================================================
         MAP
    ================================================== -->

    <div id="map"></div>


    <!-- ==================================================
         GPS BUTTON
    ================================================== -->

    <button
        id="gpsBtn"
        class="floating-btn gps-btn"
        type="button"
        onclick="goCurrentLocation()"
    >
        📍
    </button>


    <!-- ==================================================
         CUSTOMER LIST BUTTON
    ================================================== -->

    <button
        id="listBtn"
        class="floating-btn list-btn"
        type="button"
        onclick="toggleList()"
    >
        📋
    </button>


    <!-- ==================================================
         CUSTOMER LIST / BOTTOM SHEET
    ================================================== -->

    <div
        id="customerList"
        class="customer-sheet"
    >

        <div class="sheet-header">

            <h3>
                Customer List
            </h3>

            <button
                type="button"
                class="sheet-close"
                onclick="closePanel()"
            >
                ✕
            </button>

        </div>


        <div
            id="listContent"
            class="list-content"
        >
            Loading Customers...
        </div>

    </div>


    <!-- ==================================================
         LEAFLET JS
    ================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- ==================================================
         TPCL APP JS
    ================================================== -->

    <script src="./app.js"></script>

</body>

</html>
